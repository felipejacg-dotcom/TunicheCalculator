name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow openpyxl

      - name: Build EXE (onedir)
        run: |
          pyinstaller --noconsole --onedir --icon=icon.ico.ico "PROTOTIPO FINAL.py" ^
            --add-data "icon.ico.ico;." ^
            --add-data "WhatsApp Image 2026-01-31 at 7.24.43 AM.jpeg;."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunicheCalculator_EXE
          path: dist/
